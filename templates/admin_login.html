<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KikkyHairs · Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --gold:#b38728;
  --gold-light:#d4af37;
  --charcoal:#120e0c;
  --charcoal-light:#1e1814;
  --charcoal-lighter:#2a241f;
  --border:#3a3a3a;
  --white-off:#f4f4f4;
  --font-heading:'Playfair Display', serif;
  --font-body:'Montserrat', sans-serif;
}
body{
  font-family:var(--font-body);
  background:linear-gradient(to bottom, #0c0c0c, #111);
  color:var(--white-off);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem;
  line-height:1.6;
}
.login-wrapper{ width:100%; max-width:440px; }
.login-container{
  background:var(--charcoal-light);
  border:1px solid rgba(179,135,40,0.3);
  border-radius:24px;
  padding:3rem 2.5rem;
  box-shadow:0 25px 50px -12px rgba(0,0,0,0.6);
}
.brand{ text-align:center; margin-bottom:2.2rem; }
.brand h1{
  font-family:var(--font-heading);
  font-size:2rem;
  font-weight:600;
  letter-spacing:4px;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:0.6rem;
}
.brand span{
  font-size:0.65rem;
  text-transform:uppercase;
  letter-spacing:4px;
  color:#999;
  display:block;
  border-bottom:1px solid var(--border);
  padding-bottom:1.5rem;
}
.flash-message{
  background:rgba(179,135,40,0.1);
  border-left:3px solid var(--gold);
  padding:14px 18px;
  margin-bottom:1.8rem;
  border-radius:8px;
  font-size:0.85rem;
  color:var(--white-off);
}
.flash-message.error{
  border-left-color:#e8a0a0;
  color:#e8a0a0;
  background:rgba(232,160,160,0.08);
}
.flash-message.success{
  border-left-color:#81c784;
  color:#81c784;
  background:rgba(129,199,132,0.08);
}
.flash-message i{ margin-right:8px; }
.form-group{ margin-bottom:1.4rem; }
label{
  display:block;
  font-size:0.7rem;
  text-transform:uppercase;
  letter-spacing:2px;
  color:var(--gold);
  margin-bottom:0.6rem;
  font-weight:600;
}
.input-wrapper{ position:relative; }
.input-wrapper i{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:#888;
  font-size:1.1rem;
}
input{
  width:100%;
  padding:14px 16px 14px 46px;
  background:var(--charcoal-lighter);
  border:1px solid var(--border);
  border-radius:12px;
  color:#fff;
  font-family:var(--font-body);
  font-size:0.9rem;
  outline:none;
  transition:border-color 0.2s;
}
input:focus{ border-color:var(--gold); }
input::placeholder{ color:#777; }
.btn{
  width:100%;
  padding:15px;
  background:var(--gold);
  border:none;
  border-radius:50px;
  color:#000;
  font-family:var(--font-body);
  font-weight:700;
  font-size:0.85rem;
  letter-spacing:1.5px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all 0.25s;
  margin-top:0.6rem;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.btn:hover{
  background:var(--gold-light);
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(179,135,40,0.35);
}
.back-link{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:1.8rem;
  color:#888;
  font-size:0.75rem;
  text-transform:uppercase;
  letter-spacing:1.5px;
  text-decoration:none;
  transition:color 0.2s;
}
.back-link:hover{ color:var(--gold); }
.footer-note{
  text-align:center;
  margin-top:1.6rem;
  color:#666;
  font-size:0.65rem;
  text-transform:uppercase;
  letter-spacing:2px;
}
@media (max-width:480px){
  body{ padding:1rem; }
  .login-container{ padding:2.2rem 1.5rem; }
  .brand h1{ font-size:1.6rem; letter-spacing:3px; }
}
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-container">

    <div class="brand">
      <h1>KikkyHairs</h1>
      <span>Administration</span>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-message {{ category }}">
            <i class="ri-{% if category == 'success' %}check-line{% elif category == 'error' %}error-warning-line{% else %}information-line{% endif %}"></i>{{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <i class="ri-mail-line"></i>
          <input type="email" name="email" placeholder="admin@kikkyhairs.ng" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <i class="ri-lock-line"></i>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn"><i class="ri-login-box-line"></i> Sign In</button>
    </form>

    <div style="display:flex; justify-content:center;">
      <a href="{{ url_for('home') }}" class="back-link"><i class="ri-arrow-left-line"></i> Return to Store</a>
    </div>

  </div>

  <div class="footer-note">© 2026 KikkyHairs · Secure Access</div>
</div>

</body>
</html>
